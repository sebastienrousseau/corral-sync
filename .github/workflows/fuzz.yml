name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  fuzz:
    name: Run Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.1'
      - name: Fuzz clone URL validation
        run: go test -fuzz=FuzzValidateCloneURL -fuzztime=30s ./internal/remote
      - name: Fuzz visibility classification
        run: go test -fuzz=FuzzVisibilityFromPath -fuzztime=30s ./internal/crawler
