name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions: {}

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@d3d082405a06d3ec471e6f6b7a1bbc8f1137d386
    with:
      language: 'go'
      severity-threshold: 'moderate'
